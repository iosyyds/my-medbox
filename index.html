<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d9488">
<title>药盒 · 个人药品记录</title>
<style>
:root{--primary:#0d9488;--primary-light:#14b8a6;--primary-dark:#0f766e;--primary-bg:#f0fdfa;--accent:#f59e0b;--danger:#ef4444;--danger-bg:#fef2f2;--warning:#f59e0b;--warning-bg:#fffbeb;--success:#10b981;--success-bg:#ecfdf5;--text:#1f2937;--text-secondary:#6b7280;--text-light:#9ca3af;--border:#e5e7eb;--bg:#f8fafc;--card:#ffffff;--shadow-sm:0 1px 2px rgba(0,0,0,.05);--shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1);--shadow-lg:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);--radius:12px;--radius-lg:16px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh;padding-bottom:80px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,textarea,select{font-family:inherit;font-size:inherit}
img{max-width:100%;display:block}
.header{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);color:#fff;padding:20px 16px 24px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.header-inner{max-width:960px;margin:0 auto}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;background:rgba(255,255,255,.2);border-radius:10px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:22px;height:22px}
.logo-text{font-size:20px;font-weight:700;letter-spacing:.5px}
.logo-sub{font-size:11px;opacity:.8;font-weight:400}
.stats{display:flex;gap:16px;font-size:13px}
.stat-item{text-align:center}
.stat-num{font-size:18px;font-weight:700}
.stat-label{font-size:11px;opacity:.85}
.search-bar{display:flex;gap:8px;align-items:center;background:#fff;border-radius:var(--radius);padding:6px 6px 6px 14px;box-shadow:var(--shadow-sm)}
.search-input-wrap{flex:1;display:flex;align-items:center;gap:8px}
.search-input-wrap svg{width:18px;height:18px;color:var(--text-light);flex-shrink:0}
.search-input{flex:1;border:none;outline:none;font-size:15px;padding:8px 0;color:var(--text);background:transparent}
.search-input::placeholder{color:var(--text-light)}
.search-actions{display:flex;gap:6px}
.btn-ai{display:flex;align-items:center;gap:5px;background:linear-gradient(135deg,#8b5cf6,#6366f1);color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:600;transition:transform .15s,box-shadow .15s;white-space:nowrap}
.btn-ai:active{transform:scale(.96)}
.btn-ai svg{width:15px;height:15px}
.btn-camera-search{display:flex;align-items:center;justify-content:center;background:var(--primary-bg);color:var(--primary);width:38px;height:38px;border-radius:8px;transition:background .15s}
.btn-camera-search:active{background:#ccfbf1}
.btn-camera-search svg{width:18px;height:18px}
.filter-bar{max-width:960px;margin:12px auto 0;padding:0 16px;display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filter-bar::-webkit-scrollbar{display:none}
.filter-chip{padding:6px 14px;border-radius:20px;font-size:13px;background:var(--card);color:var(--text-secondary);border:1px solid var(--border);white-space:nowrap;transition:all .15s;flex-shrink:0}
.filter-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.container{max-width:960px;margin:0 auto;padding:16px}
.section-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.section-title h2{font-size:16px;font-weight:600;color:var(--text)}
.section-title span{font-size:13px;color:var(--text-light)}
.expire-banner{background:var(--warning-bg);border:1px solid #fde68a;border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.expire-banner svg{width:20px;height:20px;color:var(--warning);flex-shrink:0}
.expire-banner-text{font-size:13px;color:#92400e;flex:1}
.expire-banner-text strong{color:#78350f}
.med-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.med-card{background:var(--card);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .15s;cursor:pointer;border:1px solid var(--border)}
.med-card:active{transform:scale(.98);box-shadow:var(--shadow)}
.med-card-img{width:100%;height:140px;background:linear-gradient(135deg,#f0fdfa,#ccfbf1);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.med-card-img img{width:100%;height:100%;object-fit:cover}
.med-card-img .placeholder{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--primary)}
.med-card-img .placeholder svg{width:40px;height:40px;opacity:.5}
.med-card-img .placeholder span{font-size:12px;opacity:.6}
.med-badge{position:absolute;top:8px;right:8px;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:600}
.med-badge.expired{background:var(--danger);color:#fff}
.med-badge.expiring{background:var(--warning);color:#fff}
.med-badge.good{background:var(--success);color:#fff}
.med-card-body{padding:12px 14px}
.med-card-name{font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:6px}
.med-card-name .rx{font-size:10px;padding:1px 5px;background:#fef3c7;color:#92400e;border-radius:4px;font-weight:600}
.med-card-effect{font-size:13px;color:var(--text-secondary);margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.med-card-meta{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--text-light);padding-top:8px;border-top:1px solid var(--border)}
.med-card-meta .date{display:flex;align-items:center;gap:4px}
.med-card-meta .date svg{width:12px;height:12px}
.med-card-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.med-tag{font-size:10px;padding:2px 7px;background:var(--primary-bg);color:var(--primary-dark);border-radius:4px}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-light)}
.empty-state svg{width:64px;height:64px;opacity:.3;margin-bottom:16px}
.empty-state h3{font-size:16px;color:var(--text-secondary);margin-bottom:6px;font-weight:500}
.empty-state p{font-size:13px}
.fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(13,148,136,.4);z-index:90;transition:transform .15s}
.fab:active{transform:scale(.92)}
.fab svg{width:26px;height:26px}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.modal-overlay.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--card);width:100%;max-width:560px;max-height:90vh;border-radius:20px 20px 0 0;overflow-y:auto;animation:slideUp .25s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@media(min-width:640px){.modal-overlay{align-items:center}.modal{border-radius:var(--radius-lg);max-height:85vh}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card);z-index:1}
.modal-header h3{font-size:17px;font-weight:600}
.modal-close{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px;color:var(--text-light);transition:background .15s}
.modal-close:active{background:var(--bg)}
.modal-close svg{width:20px;height:20px}
.modal-body{padding:20px}
.modal-footer{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;position:sticky;bottom:0;background:var(--card)}
.form-group{margin-bottom:16px}
.form-label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.form-label .required{color:var(--danger)}
.form-input,.form-textarea,.form-select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;color:var(--text);background:var(--bg);transition:border-color .15s,background .15s;outline:none}
.form-input:focus,.form-textarea:focus,.form-select:focus{border-color:var(--primary);background:#fff}
.form-textarea{resize:vertical;min-height:70px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-hint{font-size:11px;color:var(--text-light);margin-top:4px}
.upload-area{border:2px dashed var(--border);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;background:var(--bg)}
.upload-area:active{border-color:var(--primary);background:var(--primary-bg)}
.upload-area svg{width:36px;height:36px;color:var(--text-light);margin-bottom:8px}
.upload-area p{font-size:13px;color:var(--text-secondary)}
.upload-area p strong{color:var(--primary)}
.upload-area .hint{font-size:11px;color:var(--text-light);margin-top:4px}
.upload-preview{position:relative;border-radius:var(--radius);overflow:hidden;margin-bottom:12px}
.upload-preview img{width:100%;max-height:200px;object-fit:cover}
.upload-remove{position:absolute;top:8px;right:8px;width:28px;height:28px;background:rgba(0,0,0,.6);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center}
.upload-remove svg{width:16px;height:16px}
.btn{padding:11px 20px;border-radius:8px;font-size:14px;font-weight:600;transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;flex:1}
.btn-primary:active{transform:scale(.98)}
.btn-secondary{background:var(--bg);color:var(--text-secondary);border:1px solid var(--border)}
.btn-danger{background:var(--danger-bg);color:var(--danger)}
.btn-block{width:100%}
.btn svg{width:16px;height:16px}
.detail-img{width:100%;height:200px;background:linear-gradient(135deg,#f0fdfa,#ccfbf1);display:flex;align-items:center;justify-content:center;margin:-20px -20px 16px}
.detail-img img{width:100%;height:100%;object-fit:cover}
.detail-img .placeholder svg{width:56px;height:56px;color:var(--primary);opacity:.4}
.detail-name{font-size:20px;font-weight:700;margin-bottom:4px}
.detail-sub{font-size:13px;color:var(--text-secondary);margin-bottom:16px}
.detail-section{margin-bottom:16px}
.detail-section-title{font-size:13px;font-weight:600;color:var(--primary);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.detail-section-title svg{width:14px;height:14px}
.detail-section-content{font-size:14px;color:var(--text);background:var(--bg);padding:10px 12px;border-radius:8px;line-height:1.7}
.detail-tags{display:flex;gap:6px;flex-wrap:wrap}
.ai-loading{text-align:center;padding:30px}
.ai-loading .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.ai-loading p{font-size:13px;color:var(--text-secondary)}
.keyword-list{display:flex;flex-direction:column;gap:8px}
.keyword-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg);border-radius:8px;cursor:pointer;transition:background .15s}
.keyword-item:active{background:var(--primary-bg)}
.keyword-item .kw-icon{width:28px;height:28px;background:linear-gradient(135deg,#8b5cf6,#6366f1);border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.keyword-item .kw-icon svg{width:14px;height:14px;color:#fff}
.keyword-item .kw-text{flex:1}
.keyword-item .kw-text .kw-main{font-size:14px;font-weight:500;color:var(--text)}
.keyword-item .kw-text .kw-sub{font-size:11px;color:var(--text-light)}
.keyword-item .kw-use{font-size:12px;color:var(--primary);font-weight:600;padding:4px 10px;background:var(--primary-bg);border-radius:6px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--text);color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:300;transition:transform .3s cubic-bezier(.16,1,.3,1);box-shadow:var(--shadow-lg);max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--success)}
.toast.error{background:var(--danger)}
@media(max-width:480px){.header{padding:16px 12px 20px}.logo-text{font-size:18px}.stats{gap:12px}.stat-num{font-size:16px}.container{padding:12px}.med-grid{grid-template-columns:1fr}.form-row{grid-template-columns:1fr}.btn-ai span{display:none}.btn-ai{padding:8px 10px}.fab{bottom:20px;right:20px;width:52px;height:52px}}
@media(min-width:768px){.med-grid{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.med-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="header-top">
      <div class="logo">
        <div class="logo-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5a7 7 0 1 1 7-7 4.5 4.5 0 0 1-4.5 4.5Z"/><path d="m8.5 8.5 7 7"/></svg></div>
        <div><div class="logo-text">我的药盒</div><div class="logo-sub">个人药品记录 · 随时查药</div></div>
      </div>
      <div class="stats">
        <div class="stat-item"><div class="stat-num" id="statTotal">0</div><div class="stat-label">药品</div></div>
        <div class="stat-item"><div class="stat-num" id="statExpired" style="color:#fecaca">0</div><div class="stat-label">过期</div></div>
      </div>
    </div>
    <div class="search-bar">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索药名、功效、症状…" autocomplete="off">
      </div>
      <div class="search-actions">
        <button class="btn-ai" id="btnAiGen" title="AI生成关键词"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3"/></svg><span>AI关键词</span></button>
        <button class="btn-camera-search" id="btnCameraSearch" title="图片搜药"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></button>
      </div>
    </div>
  </div>
</header>
<div class="filter-bar" id="filterBar">
  <button class="filter-chip active" data-filter="all">全部</button>
  <button class="filter-chip" data-filter="valid">在有效期内</button>
  <button class="filter-chip" data-filter="expiring">即将过期</button>
  <button class="filter-chip" data-filter="expired">已过期</button>
  <button class="filter-chip" data-filter="otc">非处方药</button>
  <button class="filter-chip" data-filter="rx">处方药</button>
</div>
<main class="container">
  <div class="expire-banner" id="expireBanner" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h.01"/></svg>
    <div class="expire-banner-text">有 <strong id="expireCount">0</strong> 种药品已过期或即将过期，请及时清理</div>
  </div>
  <div class="section-title"><h2 id="listTitle">我的药品</h2><span id="listCount">共 0 种</span></div>
  <div class="med-grid" id="medGrid"></div>
  <div class="empty-state" id="emptyState" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5a7 7 0 1 1 7-7 4.5 4.5 0 0 1-4.5 4.5Z"/><path d="m8.5 8.5 7 7"/></svg>
    <h3>还没有记录药品</h3><p>点击右下角 + 号，拍照或上传药品图片开始记录</p>
  </div>
</main>
<button class="fab" id="btnAdd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <div class="modal-header"><h3 id="addModalTitle">添加药品</h3><button class="modal-close" data-close="addModal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="modal-body">
      <div class="form-group"><label class="form-label">药品图片</label>
        <div class="upload-preview" id="uploadPreview" style="display:none"><img id="previewImg" alt="预览"><button class="upload-remove" id="removeImg"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
        <div class="upload-area" id="uploadArea"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg><p><strong>点击拍照</strong> 或选择图片上传</p><p class="hint">支持药盒、说明书照片，自动压缩优化</p></div>
        <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">
      </div>
      <div class="form-group"><label class="form-label">药品名称 <span class="required">*</span></label><input type="text" class="form-input" id="medName" placeholder="如：布洛芬缓释胶囊"></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">药品类型</label><select class="form-select" id="medType"><option value="otc">非处方药（OTC）</option><option value="rx">处方药（Rx）</option><option value="health">保健品</option><option value="external">外用药</option><option value="other">其他</option></select></div>
        <div class="form-group"><label class="form-label">保质期至</label><input type="date" class="form-input" id="medExpire"></div>
      </div>
      <div class="form-group"><label class="form-label">主要功效 / 适用症状</label><textarea class="form-textarea" id="medEffect" placeholder="如：用于缓解轻至中度疼痛，如头痛、关节痛、偏头痛、牙痛、肌肉痛、神经痛、痛经；也用于普通感冒或流行性感冒引起的发热"></textarea></div>
      <div class="form-group"><label class="form-label">用法用量</label><textarea class="form-textarea" id="medUsage" placeholder="如：口服。成人一次1粒，一日2次（早晚各一次）"></textarea></div>
      <div class="form-row">
        <div class="form-group"><label class="form-label">禁忌人群</label><input type="text" class="form-input" id="medTaboo" placeholder="如：孕妇、哺乳期妇女禁用"></div>
        <div class="form-group"><label class="form-label">生产厂家</label><input type="text" class="form-input" id="medFactory" placeholder="如：中美天津史克制药"></div>
      </div>
      <div class="form-group"><label class="form-label">搜索标签（逗号分隔）</label><input type="text" class="form-input" id="medTags" placeholder="如：止痛,退烧,感冒,头痛,发热"><p class="form-hint">用于快速搜索，可填写症状、功效等关键词</p></div>
      <div class="form-group"><label class="form-label">备注</label><textarea class="form-textarea" id="medNote" placeholder="其他需要记录的信息"></textarea></div>
    </div>

<script>

function getExpireStatus(e){if(!e)return{status:'unknown',label:'未设置',class:''};const n=new Date();n.setHours(0,0,0,0);const x=new Date(e);x.setHours(0,0,0,0);const d=Math.ceil((x-n)/(86400000));if(d<0)return{status:'expired',label:'已过期',class:'expired',days:d};if(d<=30)return{status:'expiring',label:'即将过期',class:'expiring',days:d};return{status:'good',label:'在有效期内',class:'good',days:d}}

function compressImage(file,maxWidth=800,quality=0.7){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=e=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height;if(w>maxWidth){h=h*maxWidth/w;w=maxWidth}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',quality))};img.onerror=reject;img.src=e.target.result};reader.onerror=reject;reader.readAsDataURL(file)})}
function escapeHtml(s){if(!s)return'';const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function renderMedicines(){const grid=$('#medGrid'),empty=$('#emptyState');let list=medicines.slice();if(currentSearch){const q=currentSearch.toLowerCase();list=list.filter(m=>[m.name,m.effect,m.usage,m.taboo,m.factory,m.note,(m.tags||[]).join(' ')].join(' ').toLowerCase().includes(q))}if(currentFilter==='valid')list=list.filter(m=>getExpireStatus(m.expireDate).status==='good');else if(currentFilter==='expiring')list=list.filter(m=>getExpireStatus(m.expireDate).status==='expiring');else if(currentFilter==='expired')list=list.filter(m=>getExpireStatus(m.expireDate).status==='expired');else if(currentFilter==='otc')list=list.filter(m=>m.type==='otc');else if(currentFilter==='rx')list=list.filter(m=>m.type==='rx');list.sort((a,b)=>{const sa=getExpireStatus(a.expireDate),sb=getExpireStatus(b.expireDate),o={expired:0,expiring:1,unknown:2,good:3};return(o[sa.status]||3)-(o[sb.status]||3)});$('#listCount').textContent='共 '+list.length+' 种';if(list.length===0){grid.innerHTML='';empty.style.display='block';empty.querySelector('h3').textContent=currentSearch||currentFilter!=='all'?'没有找到匹配的药品':'还没有记录药品';empty.querySelector('p').textContent=currentSearch||currentFilter!=='all'?'试试其他关键词或筛选条件':'点击右下角 + 号，拍照或上传药品图片开始记录'}else{empty.style.display='none';grid.innerHTML=list.map(m=>{const exp=getExpireStatus(m.expireDate),tags=(m.tags||[]).slice(0,3).map(t=>'<span class="med-tag">'+escapeHtml(t)+'</span>').join(''),imgHtml=m.image?'<img src="'+m.image+'" alt="'+escapeHtml(m.name)+'" loading="lazy">':'<div class="placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5a7 7 0 1 1 7-7 4.5 4.5 0 0 1-4.5 4.5Z"/><path d="m8.5 8.5 7 7"/></svg><span>暂无图片</span></div>',badge=exp.status!=='unknown'?'<span class="med-badge '+exp.class+'">'+exp.label+'</span>':'',rxBadge=m.type==='rx'?'<span class="rx">Rx</span>':'';return'<div class="med-card" data-id="'+m.id+'"><div class="med-card-img">'+imgHtml+badge+'</div><div class="med-card-body"><div class="med-card-name">'+escapeHtml(m.name)+' '+rxBadge+'</div><div class="med-card-effect">'+escapeHtml(m.effect||'暂无功效描述')+'</div>'+(tags?'<div class="med-card-tags">'+tags+'</div>':'')+'<div class="med-card-meta"><span class="date"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>'+formatDate(m.expireDate)+'</span><span>'+getTypeLabel(m.type)+'</span></div></div></div>'}).join('')}updateStats()}

function showDetail(id){const m=medicines.find(x=>x.id===id);if(!m)return;detailMedId=id;const exp=getExpireStatus(m.expireDate),imgHtml=m.image?'<img src="'+m.image+'" alt="'+escapeHtml(m.name)+'">':'<div class="placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5a7 7 0 1 1 7-7 4.5 4.5 0 0 1-4.5 4.5Z"/><path d="m8.5 8.5 7 7"/></svg></div>',tags=(m.tags||[]).map(t=>'<span class="med-tag">'+escapeHtml(t)+'</span>').join('');$('#detailBody').innerHTML='<div class="detail-img">'+imgHtml+'</div><div class="detail-name">'+escapeHtml(m.name)+'</div><div class="detail-sub">'+getTypeLabel(m.type)+' · <span style="color:'+(exp.status==='expired'?'var(--danger)':exp.status==='expiring'?'var(--warning)':'var(--success)')+'">'+exp.label+'</span>'+(exp.days!==undefined?'（'+(exp.days>=0?'还剩':'已过')+' '+Math.abs(exp.days)+' 天）':'')+'</div>'+(m.effect?'<div class="detail-section"><div class="detail-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>主要功效 / 适用症状</div><div class="detail-section-content">'+escapeHtml(m.effect)+'</div></div>':'')+(m.usage?'<div class="detail-section"><div class="detail-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2v8l5 3"/><circle cx="12" cy="12" r="10"/></svg>用法用量</div><div class="detail-section-content">'+escapeHtml(m.usage)+'</div></div>':'')+'<div class="form-row">'+(m.taboo?'<div class="detail-section"><div class="detail-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></svg>禁忌人群</div><div class="detail-section-content">'+escapeHtml(m.taboo)+'</div></div>':'')+(m.factory?'<div class="detail-section"><div class="detail-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V7l8-4v18M19 21V11l-6-4"/></svg>生产厂家</div><div class="detail-section-content">'+escapeHtml(m.factory)+'</div></div>':'')+'</div>'+(m.expireDate?'<div class="detail-section"><div class="detail-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>保质期</div><div class="detail-section-content">'+formatDate(m.expireDate)+'</div></div>':'')+(tags?'<div class="detail-section"><div class="detail-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></svg>搜索标签</div><div class="detail-tags">'+tags+'</div></div>':'')+(m.note?'<div class="detail-section"><div class="detail-section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>备注</div><div class="detail-section-content">'+escapeHtml(m.note)+'</div></div>':'');openModal('detailModal')}

function generateKeywords(input){const symptomMap={'头痛':['头痛','偏头痛','止痛','头疼','神经性头痛'],'发烧':['发烧','退热','退烧','发热','感冒发热'],'感冒':['感冒','流感','鼻塞','流涕','咳嗽','咳痰'],'咳嗽':['咳嗽','止咳','化痰','支气管炎','喉咙痛'],'胃痛':['胃痛','胃药','胃炎','胃酸','胃胀','消化不良'],'腹泻':['腹泻','拉肚子','止泻','肠炎','肠胃'],'过敏':['过敏','抗过敏','荨麻疹','皮疹','皮肤瘙痒'],'消炎':['消炎','抗炎','红肿','炎症','抗菌'],'失眠':['失眠','安眠','助眠','睡眠','安神'],'维生素':['维生素','补充营养','保健','免疫力','微量元素'],'血压':['血压','降压','高血压','心血管'],'血糖':['血糖','降糖','糖尿病','胰岛素'],'止痛':['止痛','镇痛','疼痛','关节痛','肌肉痛','痛经']};const medMap={'布洛芬':['布洛芬','止痛','退烧','头痛','发热','痛经','关节痛'],'对乙酰氨基酚':['对乙酰氨基酚','扑热息痛','退烧','止痛','头痛','发热'],'阿莫西林':['阿莫西林','抗生素','消炎','抗菌','感染','呼吸道感染'],'头孢':['头孢','抗生素','消炎','抗菌','感染','炎症'],'奥美拉唑':['奥美拉唑','胃药','胃酸','胃痛','胃炎','胃溃疡'],'蒙脱石散':['蒙脱石散','止泻','腹泻','拉肚子','肠炎'],'氯雷他定':['氯雷他定','抗过敏','过敏','荨麻疹','鼻炎','皮肤瘙痒'],'维生素C':['维生素C','维C','增强免疫','抗氧化','感冒预防'],'感冒灵':['感冒灵','感冒','鼻塞','头痛','发热','流涕'],'板蓝根':['板蓝根','感冒','清热解毒','咽喉痛','抗病毒'],'云南白药':['云南白药','止血','跌打损伤','活血化瘀','消肿'],'红霉素':['红霉素','抗生素','消炎','抗菌','皮肤感染'],'甲硝唑':['甲硝唑','消炎','牙痛','牙龈炎','口腔感染'],'吗丁啉':['吗丁啉','胃药','胃胀','消化不良','促胃动力'],'黄连素':['黄连素','止泻','腹泻','肠胃炎','肠道感染']};let results=[];for(const[med,kws]of Object.entries(medMap)){if(input.includes(med)||med.includes(input)){results=kws.map(k=>({main:k,sub:'与「'+med+'」相关'}));break}}if(results.length===0){for(const[sym,kws]of Object.entries(symptomMap)){if(input.includes(sym)||sym.includes(input)){results=kws.map(k=>({main:k,sub:'针对「'+sym+'」症状'}));break}}}if(results.length===0){results=[{main:input,sub:'原始关键词'},{main:input+' 功效',sub:'查看功效说明'},{main:input+' 用法',sub:'查看用法用量'},{main:input+' 副作用',sub:'查看不良反应'},{main:input+' 禁忌',sub:'查看禁忌人群'}]}return results.slice(0,6)}
$('#btnCameraSearch').addEventListener('click',()=>{$('#cameraResult').innerHTML='';openModal('cameraModal')});
$('#cameraUploadArea').addEventListener('click',()=>$('#cameraFileInput').click());
$('#cameraFileInput').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;$('#cameraResult').innerHTML='<div class="ai-loading"><div class="spinner"></div><p>正在识别图片并匹配药品…</p></div>';try{await compressImage(f,600,0.6);setTimeout(()=>{const wi=medicines.filter(m=>m.image);if(wi.length===0){$('#cameraResult').innerHTML='<div class="empty-state" style="padding:30px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:48px;height:48px"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><h3>暂无匹配结果</h3><p>还没有记录带图片的药品，先添加药品记录吧</p></div>'}else{$('#cameraResult').innerHTML='<p style="font-size:13px;color:var(--text-secondary);margin-bottom:10px">找到 '+wi.length+' 个带图片的药品记录：</p><div class="med-grid" style="grid-template-columns:1fr">'+wi.map(m=>'<div class="med-card" data-id="'+m.id+'" onclick="closeModal(\'cameraModal\');showDetail(\''+m.id+'\')"><div class="med-card-img" style="height:100px"><img src="'+m.image+'" alt="'+escapeHtml(m.name)+'"></div><div class="med-card-body" style="padding:8px 12px"><div class="med-card-name" style="font-size:14px">'+escapeHtml(m.name)+'</div></div></div>').join('')+'</div>'}},1000)}catch(err){$('#cameraResult').innerHTML='<p style="color:var(--danger);text-align:center;padding:20px">图片处理失败，请重试</p>'}e.target.value=''});
loadMedicines();renderMedicines();
window.showDetail=showDetail;window.closeModal=closeModal;
</script>
</body>
</html>
